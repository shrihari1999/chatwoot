type: object
properties:
  content:
    type: string
    description: >-
      Message content for canned response. Optional only when `file_ids` is supplied — a
      canned response must have content, at least one attachment, or both.
    example: 'Hello, {{contact.name}}! Welcome to our service.'
  short_code:
    type: string
    description: >-
      Short Code for quick access of the canned response. Must be unique within its
      category, not across the whole account.
    example: 'welcome'
  category_id:
    type: integer
    description: >-
      ID of the canned response category. Required — every canned response belongs to a
      category. Must reference a category in the same account.
    example: 1
  file_ids:
    type: array
    description: >-
      Signed Active Storage blob IDs of image attachments. Obtain one by uploading the
      file to `POST /api/v1/accounts/{account_id}/upload` and using the `blob_id` it
      returns; for attachments already on the response, reuse the `blob_signed_id` from
      its `files` array. On update, omit the key to leave the existing attachments
      untouched, or pass an empty array to detach all of them.
    items:
      type: string
required:
  - short_code
  - category_id
